<script>
  // 1. Apenas cargue la página, traemos el evento actual del backend
  async function cargarEvento() {
    try {
      const response = await fetch('/api/evento');
      const data = await response.json();
      
      // Actualizamos el título y el pozo visualmente en tu diseño
      document.querySelector('h2, .titulo-evento').innerText = data.titulo;
      document.getElementById('pozo-actual').innerText = `Pozo actual: ${data.pozo_premios} Pi`;
    } catch (error) {
      console.error("Error al cargar el evento:", error);
    }
  }

  // 2. Función cuando el usuario hace clic en "Participar (1 Pi)"
  async function participarEnEvento() {
    try {
      // Aquí puedes integrar el pago del Pi SDK si ya lo tienes configurado,
      // o simular/enviar directamente la petición al backend por ahora:
      
      const response = await fetch('/api/participar', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          monto: 1.0,
          username: "PioneroPi"
        })
      });

      const resultado = await response.json();
      if (resultado.success) {
        alert("¡Participación exitosa! El pozo ha aumentado.");
        cargarEvento(); // Recargamos para ver el pozo actualizado
      }
    } catch (error) {
      console.error("Error al participar:", error);
    }
  }

  // Ejecutar al abrir la app
  window.onload = cargarEvento;
</script>
