<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2Ppredict - Pi Network</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        p.subtitulo {
            color: #b0b0b0;
            font-size: 14px;
            margin-bottom: 25px;
            text-align: center;
        }
        .card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 15px;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            margin-bottom: 12px;
            font-size: 14px;
        }
        button {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        button.btn-principal {
            background-color: #7b1fa2; /* Morado estilo Pi Network */
        }
        button:hover {
            opacity: 0.9;
        }
        .pozo-texto {
            color: #ccc;
            font-size: 14px;
            margin: 15px 0;
        }
    </style>
</head>
<body>

    <h1>P2Ppredict 🔮</h1>
    <p class="subtitulo">Plataforma de Predicciones P2P en Pi Network</p>

    <!-- Tarjeta para Crear una Nueva Predicción -->
    <div class="card">
        <h3>Crea tu propia predicción</h3>
        <input type="text" id="nuevo-titulo" placeholder="Ej: ¿Lloverá mañana en la ciudad?">
        <button onclick="crearPrediccion()">Publicar Predicción</button>
    </div>

    <!-- Contenedor donde se listarán dinámicamente todos los eventos activos -->
    <div id="contenedor-eventos" style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="card">
            <h3>Cargando eventos...</h3>
        </div>
    </div>

    <script>
        // 1. Cargar todos los eventos activos desde el backend
        async function cargarEventos() {
            try {
                const response = await fetch('/api/eventos');
                const eventos = await response.json();
                
                const contenedor = document.getElementById('contenedor-eventos');
                contenedor.innerHTML = ''; // Limpiar contenedor

                if (eventos.length === 0) {
                    contenedor.innerHTML = '<div class="card"><h3>No hay predicciones activas</h3></div>';
                    return;
                }

                // Generar una tarjeta por cada evento activo
                eventos.forEach(ev => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <h3>${ev.titulo}</h3>
                        <div class="pozo-texto">Pozo actual: ${ev.pozo_premios.toFixed(2)} Pi</div>
                        <button class="btn-principal" onclick="participar(${ev.id})">Participar (1 Pi)</button>
                    `;
                    contenedor.appendChild(card);
                });

            } catch (error) {
                console.error("Error al cargar eventos:", error);
                document.getElementById('contenedor-eventos').innerHTML = '<div class="card"><h3>Error al cargar eventos</h3></div>';
            }
        }

        // 2. Crear una nueva predicción
        async function crearPrediccion() {
            const titulo = document.getElementById('nuevo-titulo').value;
            if (!titulo) {
                alert("Por favor escribe una predicción.");
                return;
            }

            try {
                const response = await fetch('/api/crear-evento', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ titulo: titulo })
                });
                const resultado = await response.json();
                
                if (resultado.success) {
                    alert("¡Predicción publicada con éxito!");
                    document.getElementById('nuevo-titulo').value = '';
                    cargarEventos(); // Refresca la lista para mostrar la nueva
                }
            } catch (error) {
                console.error("Error al crear predicción:", error);
            }
        }

        // 3. Participar en un evento específico utilizando su ID
        async function participar(eventoId) {
            try {
                const response = await fetch('/api/participar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ evento_id: eventoId, monto: 1.0, username: "Pionero" })
                });

                const resultado = await response.json();
                if (resultado.success) {
                    alert(`¡Participación exitosa! Tu Pi se sumó al pozo de este evento.`);
                    cargarEventos(); // Actualiza los pozos en pantalla
                } else {
                    alert("Error: " + resultado.error);
                }
            } catch (error) {
                console.error("Error al participar:", error);
                alert("Hubo un error al procesar la participación.");
            }
        }

        // Ejecutar al cargar la página
        window.onload = cargarEventos;
    </script>
</body>
</html>
